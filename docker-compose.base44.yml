services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buildtrack
      POSTGRES_PASSWORD: buildtrack
      POSTGRES_DB: buildtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildtrack -d buildtrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://buildtrack:buildtrack@db:5432/buildtrack
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma db push --skip-generate"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://buildtrack:buildtrack@db:5432/buildtrack
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      WATCHPACK_POLLING: "true"
    command: npx next dev -H 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  node_modules:
